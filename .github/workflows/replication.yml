name: Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  replicate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Verify frozen input snapshot
        run: sha256sum --check data/raw.sha256

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Preserve committed reference outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reference"
          git archive HEAD outputs | tar -xf - -C "$RUNNER_TEMP/reference"

      - name: Run tests and replication
        run: python replication/run_all.py

      - name: Compare regenerated outputs with committed references
        run: |
          python replication/compare_outputs.py \
            --reference-dir "$RUNNER_TEMP/reference/outputs"

      - name: Check for unexpected output files
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git ls-files --others --exclude-standard -- outputs)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::The replication created untracked files under outputs/."
            printf '%s\n' "$unexpected"
            exit 1
          fi
