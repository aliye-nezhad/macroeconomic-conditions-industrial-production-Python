name: Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  replicate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Verify frozen input snapshot
        run: sha256sum --check data/raw.sha256

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests and replication
        run: python replication/run_all.py

      - name: Verify committed outputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- outputs
          if [[ -n "$(git status --porcelain --untracked-files=all -- outputs)" ]]; then
            echo "::error::The replication created untracked files under outputs/."
            git status --short --untracked-files=all -- outputs
            exit 1
          fi
